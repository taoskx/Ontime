name: Build Ontime dmg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 编译打包
        run: bash build-mac.sh

      - name: 上传 dmg
        uses: actions/upload-artifact@v4
        with:
          name: Ontime-7-mac-arm64
          path: Ontime-7-mac-arm64.dmg
          retention-days: 14
